# Builds the jbh-web image (production build of the app + Caddy) and pushes it to GHCR,
# tagged with the git SHA.
name: Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Output goes to www/ (angular.json outputPath.base). environment.prod.ts uses the relative /jbh-api.
      - name: Build app
        run: npx ng build --configuration production

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # One version per push. Build attestations would add untagged versions that fill the keep-5 window.
          provenance: false
          tags: |
            ghcr.io/kkpa-jbh/jbh-web:${{ github.sha }}
            ghcr.io/kkpa-jbh/jbh-web:latest

      # GitHub Free: 500 MB for private packages. Keep the 5 newest images; that is the rollback window.
      - name: Delete old images
        uses: actions/delete-package-versions@v5
        with:
          package-name: jbh-web
          package-type: container
          min-versions-to-keep: 5
