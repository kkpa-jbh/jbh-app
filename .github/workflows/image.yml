# Builds the jbh-web image (production build of the app + Caddy) and pushes it to GHCR,
# tagged with the git SHA. Then, when the repo variable AUTO_DEPLOY is "true", deploys that exact image
# (jbh-deploy CI.md, "Auto-deploy").
name: Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

# One run at a time, in push order, so an older image never deploys after a newer one.
# A newer waiting run replaces an older waiting one. That is fine: the newer commit has the older changes too.
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Output goes to www/ (angular.json outputPath.base). environment.prod.ts uses the relative /jbh-api.
      - name: Build app
        run: npx ng build --configuration production

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # One version per push. Build attestations would add untagged versions that use up the 2 kept slots.
          provenance: false
          tags: |
            ghcr.io/kkpa-jbh/jbh-web:${{ github.sha }}
            ghcr.io/kkpa-jbh/jbh-web:latest

      # GitHub Free: 500 MB for private packages. Keep the 2 newest images: the running one and one to roll back to.
      - name: Delete old images
        uses: actions/delete-package-versions@v5
        with:
          package-name: jbh-web
          package-type: container
          min-versions-to-keep: 2

  # Starts the Deploy workflow in jbh-deploy for the image of this commit. It does not wait for the result:
  # see jbh-deploy → Actions → Deploy. A deploy that is not healthy goes back to the image from before by itself.
  # Off until the repo variable AUTO_DEPLOY is "true". DEPLOY_DISPATCH_TOKEN can only start workflows in jbh-deploy.
  deploy:
    needs: image
    if: vars.AUTO_DEPLOY == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Start Deploy jbh-web
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          gh api --method POST repos/kkpa-jbh/jbh-deploy/actions/workflows/deploy.yml/dispatches \
            -f ref=main -f 'inputs[action]=deploy' -f 'inputs[service]=jbh-web' -f "inputs[tag]=$GITHUB_SHA"
          echo "Deploy started for $GITHUB_SHA: https://github.com/kkpa-jbh/jbh-deploy/actions/workflows/deploy.yml" >> "$GITHUB_STEP_SUMMARY"
