# Image: builds the jbh-web image for two CPU types (amd64 and arm64) and pushes both to GHCR
# (GitHub Container Registry) under ONE tag: the git SHA, and also "latest".
# jbh-web = the production build of the app, served by Caddy (see Dockerfile).
#
# When it runs:
# - after every push to main (a merged PR is a push to main),
# - or by hand, with the "Run workflow" button in the Actions tab.
#
# What it changes: the GHCR package ghcr.io/kkpa-jbh/jbh-web, and (with AUTO_DEPLOY) the live site.
#
# Jobs, in order:
# 1. package - install, check the UI boundary, build the app once into www/ (it does not depend on the CPU type).
# 2. image   - calls the reusable workflow jbh-deploy/.github/workflows/multi-arch-image.yml. It builds
#              "Build image (amd64)" and "Build image (arm64)" on native runners, publishes one tag for both,
#              and keeps the 10 newest tagged images. One file in jbh-deploy serves all 5 service repos.
# 3. deploy  - auto-deploy: only when the repo variable AUTO_DEPLOY is "true".
#              It asks jbh-deploy to deploy that exact image (jbh-deploy CI.md, "Auto-deploy").

# The name shown in the GitHub "Actions" tab.
name: Image

on:
  # Adds a "Run workflow" button in the Actions tab, to build by hand.
  workflow_dispatch:
  # Runs on every push to main.
  push:
    branches: [ main ]

# The automatic GITHUB_TOKEN gets no permission at the top. Each job asks only for what it needs.
permissions: {}

# One run at a time, in push order, so an older image never deploys after a newer one.
# - group: image               -> all runs of this workflow share one queue.
# - queue: max                 -> every waiting run stays in the queue (up to 100). The default (single) cancels a
#                                 waiting run when a newer one arrives, and that commit would never get its image.
#                                 So every merge gets an image (and, with AUTO_DEPLOY, a deploy), in order.
# - cancel-in-progress: false  -> a running build is never stopped halfway.
concurrency:
  group: image
  queue: max
  cancel-in-progress: false

jobs:
  # Builds the app once. Machine: a GitHub-hosted Ubuntu VM, deleted after the run.
  # www/ is plain HTML, JS and CSS, so the same files go into the amd64 and the arm64 image.
  package:
    name: Check and build the app package
    runs-on: ubuntu-latest
    # npm ci + the production build take about 4 minutes. 20 leaves room for a cold cache.
    timeout-minutes: 20
    permissions:
      # Download the code. Nothing else.
      contents: read
    steps:
      # The VM starts empty. This step downloads the code of this commit into it.
      # Actions are pinned to a full commit SHA (the version is in the comment), so a moved tag cannot change them.
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Installs Node.js 22. "cache: npm" saves the npm download cache between runs,
      # so npm does not download every package again each time. The cache key comes from package-lock.json.
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      # npm ci: installs the exact versions in package-lock.json, from a clean node_modules.
      # It fails if package.json and package-lock.json do not match.
      - name: Install dependencies
        run: npm ci

      # Pages must use the jbh-* layer, not Ionic or ngx-charts directly. Fails before the image is built.
      - name: Check UI boundary
        run: npm run lint:boundary

      # Production build of the Angular app.
      # --configuration production: uses environment.prod.ts (the relative baseUrl /jbh-api) and optimizes the output.
      # Output goes to www/ (angular.json outputPath.base). The Dockerfile copies it into the image.
      # --define JBH_GIT_SHA: the builder pastes this value into the code as the app version that Faro sends.
      # It is the commit SHA, the same value as the image tag and the backend service.version.
      # The inner single quotes are required: the builder pastes the value as code, so a string must be quoted.
      - name: Build app
        run: npx ng build --configuration production --define "JBH_GIT_SHA='$GITHUB_SHA'"

      # Hands www/ to the image jobs (each job runs on its own VM, so files do not carry over).
      # retention-days: 1 -> the artifact is only needed during this run.
      - name: Upload the app package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-package
          path: www/
          retention-days: 1

  # Builds, tags and cleans the image, through the reusable workflow in jbh-deploy.
  # needs: package -> it waits for www/ (the artifact "app-package").
  # Pinned to a jbh-deploy commit SHA, like an action: a change there reaches this repo only when you bump the SHA.
  # In the Actions tab its jobs show as "Build and publish the image / Build image (amd64)", and so on.
  image:
    name: Build and publish the image
    needs: package
    # The most the called jobs may use: read the code, push and delete images in GHCR.
    permissions:
      contents: read
      packages: write
    uses: kkpa-jbh/jbh-deploy/.github/workflows/multi-arch-image.yml@b43ac11f520b62fbe5d90516669692316380d00c # JBH-86
    with:
      image: ghcr.io/kkpa-jbh/jbh-web
      package-name: jbh-web
      # The repo root holds the Dockerfile and deploy/Caddyfile.
      context: .
      # The Dockerfile copies www/.
      app-package-path: www

  # Auto-deploy. Starts the Deploy workflow in jbh-deploy for the image of this commit. It does not wait for the result:
  # see jbh-deploy → Actions → Deploy. A deploy that is not healthy goes back to the image from before by itself.
  # Off until the repo variable AUTO_DEPLOY is "true". DEPLOY_DISPATCH_TOKEN can only start workflows in jbh-deploy.
  deploy:
    # Waits for the job "image": it ends only after the multi-arch tag exists (and the cleanup ran).
    # If "image" fails, this job does not run, so a deploy never asks for a tag that is missing.
    needs: image
    # Runs only when both are true:
    # - vars.AUTO_DEPLOY == 'true'          -> repo variable (Settings → Secrets and variables → Actions → Variables).
    # - github.ref == 'refs/heads/main'     -> a "Run workflow" by hand on another branch never deploys.
    if: vars.AUTO_DEPLOY == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One API call to start the Deploy workflow. It does not wait for the deploy itself.
    timeout-minutes: 5
    # The GITHUB_TOKEN gets no permissions here: this job uses DEPLOY_DISPATCH_TOKEN instead.
    permissions: {}
    steps:
      - name: Start Deploy jbh-web
        env:
          # The gh CLI reads its token from GH_TOKEN.
          # DEPLOY_DISPATCH_TOKEN: a repo secret you add by hand. It may only start workflows in jbh-deploy.
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        # gh api --method POST .../dispatches: starts the workflow deploy.yml in jbh-deploy (a "workflow_dispatch" event).
        # - -f ref=main                          -> run the deploy.yml that is on main in jbh-deploy.
        # - -f 'inputs[action]=deploy'           -> deploy (the other action is rollback).
        # - -f 'inputs[service]=jbh-web'         -> deploy only jbh-web.
        # - -f "inputs[tag]=$GITHUB_SHA"         -> the image tag: the SHA of this commit, pushed by the job "image".
        # The echo line adds a link to the deploy run on this run's summary page.
        run: |
          gh api --method POST repos/kkpa-jbh/jbh-deploy/actions/workflows/deploy.yml/dispatches \
            -f ref=main -f 'inputs[action]=deploy' -f 'inputs[service]=jbh-web' -f "inputs[tag]=$GITHUB_SHA"
          echo "Deploy started for $GITHUB_SHA: https://github.com/kkpa-jbh/jbh-deploy/actions/workflows/deploy.yml" >> "$GITHUB_STEP_SUMMARY"
