<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ 'products.transfer.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{ 'products.transfer.titleLarge' | translate }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="jbh-container">
    <div class="jbh-card-elevated">
      <h1 class="jbh-title">{{ 'products.transfer.welcome' | translate }}</h1>
      <p class="jbh-subtitle">{{ 'products.transfer.description' | translate }}</p>
    </div>
  </div>
</ion-content>
