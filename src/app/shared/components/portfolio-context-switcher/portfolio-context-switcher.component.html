<div class="jbh-context-switcher">
  @let context = currentContext$ | async;
  <jbh-select
    [formControl]="contextControl"
    [label]="'context.viewing' | translate"
    [icon]="context ? (context.isPersonal ? 'person-outline' : 'people-outline') : undefined"
  >
    <jbh-select-option value="personal">
      {{ 'context.personalPortfolio' | translate }}
    </jbh-select-option>
    @for (team of teams; track team.id) {
      <jbh-select-option [value]="'team_' + team.id">
        {{ team.shortName }}
      </jbh-select-option>
    }
  </jbh-select>
</div>
