<div class="jbh-menu-container">
  <!-- Menu Header -->
  <div class="jbh-menu-header">
    <div class="jbh-menu-header-gradient"></div>
    <div class="jbh-menu-header-content">
      <div class="jbh-menu-logo">
        <ion-icon name="apps-outline"></ion-icon>
      </div>
      <h2 class="jbh-menu-header-title">{{ 'menu.appName' | translate }}</h2>
      <p class="jbh-menu-header-subtitle">{{ 'menu.appTagline' | translate }}</p>
    </div>
  </div>

  <!-- Menu Items -->
  <div class="jbh-menu-content">
    <ion-list class="jbh-menu-list">
      <ng-container *ngFor="let item of menuItems">
        <!-- Install App Button (shown before divider/logout) -->
        <app-install-app-button *ngIf="item.id === 'divider-1'"></app-install-app-button>

        <!-- Divider -->
        <div *ngIf="item.divider" class="jbh-menu-divider"></div>

        <!-- Menu Item (Parent) -->
        <div *ngIf="!item.divider" class="jbh-menu-item-wrapper">
          <ion-item
            [button]="true"
            [detail]="false"
            lines="none"
            class="jbh-menu-item"
            [class.jbh-menu-item-active]="isActive(item)"
            [class.jbh-menu-item-expanded]="item.expanded"
            (click)="handleMenuItemClick(item, $event)">
            <ion-icon [name]="item.icon" slot="start" class="jbh-menu-item-icon"></ion-icon>
            <ion-label class="jbh-menu-item-label">
              {{ item.translationKey | translate }}
            </ion-label>
            <ion-icon
              *ngIf="item.children"
              [name]="item.expanded ? 'chevron-up-outline' : 'chevron-down-outline'"
              slot="end"
              class="jbh-menu-item-chevron">
            </ion-icon>
          </ion-item>

          <!-- Submenu (Children) -->
          <div *ngIf="item.children && item.expanded" class="jbh-menu-submenu">
            <ion-item
              *ngFor="let child of item.children"
              [button]="true"
              [detail]="false"
              lines="none"
              class="jbh-menu-subitem"
              [class.jbh-menu-subitem-active]="isActive(child)"
              (click)="handleMenuItemClick(child, $event)">
              <ion-icon [name]="child.icon" slot="start" class="jbh-menu-subitem-icon"></ion-icon>
              <ion-label class="jbh-menu-subitem-label">
                {{ child.translationKey | translate }}
              </ion-label>
            </ion-item>
          </div>
        </div>
      </ng-container>
    </ion-list>
  </div>

  <!-- Menu Footer -->
  <div class="jbh-menu-footer">
    <div class="jbh-menu-footer-info">
      <p class="jbh-menu-footer-version">{{ 'menu.version' | translate }} 1.0.0</p>
      <p class="jbh-menu-footer-copyright">© 2025 JBH App</p>
    </div>
  </div>
</div>
