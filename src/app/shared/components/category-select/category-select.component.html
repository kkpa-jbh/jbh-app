<jbh-select
  icon="pricetag-outline"
  [formControl]="control"
  [placeholder]="placeholder()"
  [loading]="isLoading()"
  [error]="hasError() ? ('products.addMovement.validation.required' | translate) : null"
>
  @for (category of categories(); track category.id) {
    <jbh-select-option [value]="category.id">
      {{ category.displayName | jbhDisplayName : category.alias }}
    </jbh-select-option>
  }
</jbh-select>

@if (hasDescription()) {
  <div class="category-description-hint jbh-animate-fade-in">
    <jbh-icon name="information-circle-outline" />
    <p>{{ selectedCategory()!.description | jbhDisplayName }}</p>
  </div>
}
