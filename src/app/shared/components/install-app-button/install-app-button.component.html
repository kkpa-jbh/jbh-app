<!-- Show install button only if app is not installed and can be installed -->
@if (!isInstalled && canInstall) {
  <div class="install-button-wrapper">
    <jbh-nav-item
      class="install-item"
      icon="download-outline"
      (activate)="handleInstallClick()">
      {{ 'pwa.installApp' | translate }}
      <span jbhNavItemEnd class="install-badge">{{ 'pwa.new' | translate }}</span>
    </jbh-nav-item>
  </div>
}

<!-- Already installed indicator (optional) -->
@if (isInstalled) {
  <div class="install-button-wrapper">
    <jbh-nav-item
      class="installed-item"
      icon="checkmark-circle">
      {{ 'pwa.appInstalled' | translate }}
    </jbh-nav-item>
  </div>
}
