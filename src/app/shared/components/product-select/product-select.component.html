<jbh-select
  icon="wallet-outline"
  [formControl]="control"
  [placeholder]="placeholder()"
  [loading]="isLoading()"
  [error]="hasError() ? errorMessage() : null"
>
  @if (emptyOption(); as empty) {
    <jbh-select-option [value]="empty.value">{{ empty.label }}</jbh-select-option>
  }
  @for (product of products(); track product.id) {
    <jbh-select-option [value]="product.id">{{ product.name }}</jbh-select-option>
  }
</jbh-select>
