@if (currentContext$ | async; as context) {
  <div class="jbh-top-banner">
    <div class="jbh-top-banner-content">
      <div class="jbh-top-banner-icon">
        <ion-icon [name]="context.isPersonal ? 'person-outline' : 'people-outline'"></ion-icon>
      </div>
      <div class="jbh-top-banner-details">
        <div class="jbh-top-banner-label">
          {{ (context.isPersonal ? 'context.myPortfolio' : 'context.teamPortfolio') | translate }}
        </div>
        <h1 class="jbh-top-banner-title">
          {{ context.isPersonal ? ('context.personalPortfolio' | translate) : context.teamName }}
        </h1>
      </div>
    </div>
  </div>
}
