@if (shouldShowHeader$ | async) {
  @let config = pageConfig$ | async;

  <!-- Portfolio Context Banner -->
  @if (currentContext$ | async; as context) {
    <div class="jbh-context-banner">
      <jbh-icon [name]="context.isPersonal ? 'person-outline' : 'people-outline'" />
      <span>{{ context.isPersonal ? ('context.personalPortfolio' | translate) : context.teamName }}</span>
    </div>
  }

  <!-- Page Header Toolbar -->
  <jbh-toolbar
    [title]="config?.title | translate"
    [back]="config?.showBackButton ?? false"
    [backHref]="config?.defaultBackHref"
    [actions]="config?.actions ?? []"
  />
}
