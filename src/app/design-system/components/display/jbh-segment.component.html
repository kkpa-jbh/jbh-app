<ion-segment [value]="value()" [attr.aria-label]="label() ?? null" (ionChange)="onChange($event)">
  @for (option of options(); track option.value) {
    <ion-segment-button [value]="option.value">
      @if (option.icon) {
        <jbh-icon class="jbh-segment__icon" [name]="option.icon" />
      }
      <ion-label>{{ option.label }}</ion-label>
    </ion-segment-button>
  }
</ion-segment>
