<jbh-page (pageEnter)="onPageEnter()" (pageLeave)="onPageLeave()">
  <app-header jbhPageHeader></app-header>

  <div class="jbh-container">
    @if (isLoading) {
      <jbh-card variant="form">
        <div class="profile-loading">
          <jbh-spinner />
        </div>
      </jbh-card>
    }

    @if (!isLoading) {
      <jbh-card variant="form">
        <jbh-page-header
          variant="form"
          icon="person-outline"
          [title]="'profile.formTitle' | translate"
          [subtitle]="'profile.formSubtitle' | translate"
        />

        <form [formGroup]="preferencesForm" (ngSubmit)="onSubmit()">

          <jbh-select
            formControlName="defaultLang"
            icon="language-outline"
            requirement="required"
            [label]="'profile.language.label' | translate"
            [placeholder]="'profile.language.placeholder' | translate"
            [error]="hasError('defaultLang') ? getErrorMessage('defaultLang') : ''"
          >
            <jbh-select-option [value]="Language.EN">{{ 'profile.language.EN' | translate }}</jbh-select-option>
            <jbh-select-option [value]="Language.ES">{{ 'profile.language.ES' | translate }}</jbh-select-option>
          </jbh-select>

          <jbh-select
            formControlName="defaultCurrency"
            icon="cash-outline"
            requirement="required"
            [label]="'profile.currency.label' | translate"
            [placeholder]="'profile.currency.placeholder' | translate"
            [error]="hasError('defaultCurrency') ? getErrorMessage('defaultCurrency') : ''"
          >
            <jbh-select-option [value]="Currency.COP">{{ 'profile.currency.COP' | translate }}</jbh-select-option>
            <jbh-select-option [value]="Currency.USD">{{ 'profile.currency.USD' | translate }}</jbh-select-option>
          </jbh-select>

          <jbh-number-field
            formControlName="savingsGoal"
            icon="wallet-outline"
            requirement="required"
            [decimals]="2"
            [label]="'profile.savingsGoal.label' | translate"
            [placeholder]="'profile.savingsGoal.placeholder' | translate"
            [error]="hasError('savingsGoal') ? getErrorMessage('savingsGoal') : ''"
          />

          <div>
            <label class="jbh-label">{{ 'profile.defaultProduct.label' | translate }}</label>
            <app-product-select
              formControlName="defaultProductId"
              [products]="products"
              [placeholder]="'profile.defaultProduct.placeholder' | translate"
              [emptyOption]="{ label: ('profile.defaultProduct.none' | translate), value: null }"
            ></app-product-select>
          </div>

          <button
            type="submit"
            jbhButton
            block
            icon="save-outline"
            [loading]="isSubmitting"
            [disabled]="isSubmitting || preferencesForm.invalid"
          >
            {{ (isSubmitting ? 'profile.saving' : 'profile.saveButton') | translate }}
          </button>

        </form>
      </jbh-card>
    }
  </div>
</jbh-page>
