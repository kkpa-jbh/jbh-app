<jbh-page (pageEnter)="onPageEnter()" (pageLeave)="onPageLeave()">
  <app-header jbhPageHeader></app-header>

  <div class="jbh-container jbh-container-wide">

    <jbh-page-header
      icon="wallet-outline"
      [title]="'products.overview.formTitle' | translate"
      [subtitle]="'products.overview.formSubtitle' | translate"
    >
      @if (canModifyProducts()) {
        <button type="button" jbhButton icon="add-outline" (click)="navigateToCreate()">
          {{ 'products.overview.createButton' | translate }}
        </button>
      }
    </jbh-page-header>

    @if (isLoading) {
      <div class="jbh-loading-container">
        @for (i of [1, 2, 3]; track i) {
          <div class="overview-card-skeleton">
            <div class="overview-skeleton-header">
              <jbh-skeleton class="overview-skeleton-icon" />
              <div class="overview-skeleton-info">
                <jbh-skeleton class="overview-skeleton-name" />
                <jbh-skeleton class="overview-skeleton-type" />
              </div>
            </div>
            <div class="overview-skeleton-balances">
              @for (j of [1, 2, 3, 4]; track j) {
                <jbh-skeleton class="overview-skeleton-balance" />
              }
            </div>
            <jbh-skeleton class="overview-skeleton-footer" />
          </div>
        }
      </div>
    }

    @if (!isLoading && products.length === 0) {
      <jbh-empty-state
        icon="wallet-outline"
        [title]="'products.overview.empty.title' | translate"
        [message]="'products.overview.empty.message' | translate"
      >
        @if (canModifyProducts()) {
          <button type="button" jbhButton icon="add-outline" (click)="navigateToCreate()">
            {{ 'products.overview.empty.createButton' | translate }}
          </button>
        }
      </jbh-empty-state>
    }

    @if (!isLoading && products.length > 0) {
      <div class="overview-products-list">
        @for (product of products; track product.id) {
          <app-product-card
            [product]="product"
            [showActions]="canModifyProducts()"
            (edit)="navigateToEdit(product)"
            (delete)="confirmDeleteProduct(product)"
            (statusChange)="onStatusChange(product, $event)"
            (viewHistory)="navigateToBalanceHistory(product)"
            (addMovement)="navigateToAddMovement(product)"
          ></app-product-card>
        }
      </div>
    }

  </div>
</jbh-page>
