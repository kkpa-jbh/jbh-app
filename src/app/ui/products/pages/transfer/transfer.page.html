<jbh-page (pageEnter)="onPageEnter()" (pageLeave)="onPageLeave()">
  <app-header jbhPageHeader></app-header>

  <div class="jbh-container">
    <jbh-card variant="form">
      <jbh-page-header
        variant="form"
        icon="swap-horizontal-outline"
        [title]="'products.transfer.formTitle' | translate"
        [subtitle]="'products.transfer.formSubtitle' | translate"
      />

      <form [formGroup]="transferForm" (ngSubmit)="onSubmit()">

        <div>
          <label class="jbh-label">{{ 'products.transfer.fromAccount.label' | translate }}</label>
          <app-product-select
            formControlName="fromAccountId"
            [products]="products"
            [isLoading]="isLoadingProducts"
            [placeholder]="'products.transfer.fromAccount.placeholder' | translate"
            [hasError]="hasError('fromAccountId')"
            [errorMessage]="getErrorMessage('fromAccountId')"
          ></app-product-select>
        </div>

        <div class="jbh-transfer-arrow">
          <jbh-icon name="arrow-forward-outline" />
        </div>

        <div>
          <label class="jbh-label">{{ 'products.transfer.toAccount.label' | translate }}</label>
          <app-product-select
            formControlName="toAccountId"
            [products]="toAccountProducts"
            [isLoading]="isLoadingProducts"
            [placeholder]="'products.transfer.toAccount.placeholder' | translate"
            [hasError]="hasError('toAccountId')"
            [errorMessage]="getErrorMessage('toAccountId')"
          ></app-product-select>
        </div>

        <jbh-number-field
          formControlName="totalAmount"
          icon="cash-outline"
          [decimals]="2"
          [label]="'products.transfer.totalAmount.label' | translate"
          [placeholder]="'products.transfer.totalAmount.placeholder' | translate"
          [error]="hasError('totalAmount') ? getErrorMessage('totalAmount') : ''"
        />

        <jbh-date-field
          formControlName="transferDate"
          [label]="'products.transfer.transferDate.label' | translate"
          [max]="todayIso"
          [error]="hasError('transferDate') ? getErrorMessage('transferDate') : ''"
        />

        <button
          type="submit"
          jbhButton
          block
          icon="swap-horizontal-outline"
          [loading]="isSubmitting"
          [disabled]="isSubmitting"
        >
          {{ (isSubmitting ? 'products.transfer.saving' : 'products.transfer.saveButton') | translate }}
        </button>

      </form>
    </jbh-card>
  </div>
</jbh-page>
