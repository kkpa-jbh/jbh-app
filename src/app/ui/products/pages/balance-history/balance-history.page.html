<jbh-page (pageEnter)="onPageEnter()" (pageLeave)="onPageLeave()">
  <app-header jbhPageHeader></app-header>

  <div class="jbh-container jbh-container-wide">
    <jbh-page-header
      icon="analytics-outline"
      [title]="'products.balanceHistory.formTitle' | translate"
      [subtitle]="'products.balanceHistory.formSubtitle' | translate"
    />

    @if (!isProductsLoading) {
      <app-balance-history-filter
        [products]="products"
        [initialProductId]="initialProductId"
        (filterApplied)="onFilterApplied($event)"
      ></app-balance-history-filter>
    } @else {
      <div class="balance-filter-skeleton">
        <jbh-skeleton shape="input" class="balance-skeleton-input" />
        <jbh-skeleton shape="input" class="balance-skeleton-input" />
        <jbh-skeleton shape="input" class="balance-skeleton-input" />
      </div>
    }

    @if (isLoading && currentFilter) {
      <div class="balance-skeleton-summary">
        @for (item of [1, 2, 3, 4]; track item) {
          <jbh-skeleton class="balance-skeleton-summary-card" />
        }
      </div>
      <jbh-skeleton class="balance-skeleton-chart" />
      <jbh-skeleton shape="table" />
    }

    @if (!isLoading && hasData && summary) {
      <app-balance-summary-cards
        [summary]="summary"
      ></app-balance-summary-cards>

      <app-balance-chart
        [balances]="balances"
      ></app-balance-chart>

      <app-balance-history-table
        [balances]="balances"
        [showProductColumn]="showProductColumn"
      ></app-balance-history-table>
    }

    @if (!isLoading && !hasData && currentFilter) {
      <jbh-empty-state
        icon="wallet-outline"
        [title]="'products.balanceHistory.empty.title' | translate"
        [message]="'products.balanceHistory.empty.message' | translate"
      />
    }

    @if (!isLoading && !currentFilter) {
      <jbh-empty-state
        icon="analytics-outline"
        [title]="'products.balanceHistory.formTitle' | translate"
        [message]="'products.balanceHistory.description' | translate"
      />
    }
  </div>
</jbh-page>
