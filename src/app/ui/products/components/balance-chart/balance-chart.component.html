<div class="balance-chart-container">
  <h3 class="balance-chart-title">{{ 'products.balanceHistory.chart.title' | translate }}</h3>
  @if (chartData.length > 0 && chartData[0].points.length > 0) {
    <jbh-line-chart
      [series]="chartData"
      [showLegend]="showLegend"
      [valueFormatter]="yAxisTickFormat"
    />
  } @else {
    <jbh-empty-state icon="analytics-outline" [title]="'products.balanceHistory.empty.title' | translate" />
  }
</div>
