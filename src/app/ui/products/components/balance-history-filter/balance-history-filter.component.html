<form [formGroup]="filterForm" class="balance-filter" (ngSubmit)="onApplyFilter()">
  <div class="balance-filter-field">
    <label class="jbh-label">{{ 'products.balanceHistory.product.label' | translate }}</label>
    <app-product-select
      formControlName="productId"
      [products]="products"
      [placeholder]="'products.balanceHistory.product.placeholder' | translate"
      [emptyOption]="{ label: ('products.balanceHistory.allProducts' | translate), value: '' }"
    ></app-product-select>
  </div>

  <div class="balance-filter-field">
    <jbh-date-field
      formControlName="startPeriod"
      mode="month"
      [label]="'products.balanceHistory.startPeriod.label' | translate"
      [min]="minStartDate"
      [max]="maxDate"
      [error]="getStartPeriodError()"
    />
  </div>

  <div class="balance-filter-field">
    <jbh-date-field
      formControlName="endPeriod"
      mode="month"
      [label]="'products.balanceHistory.endPeriod.label' | translate"
      [min]="minStartDate"
      [max]="maxDate"
      [error]="getEndPeriodError()"
    />
  </div>

  <div class="balance-filter-actions">
    <button type="submit" jbhButton icon="search-outline" [disabled]="filterForm.invalid">
      {{ 'products.balanceHistory.applyFilter' | translate }}
    </button>
  </div>
</form>
