<jbh-page (pageEnter)="onPageEnter()" (pageLeave)="onPageLeave()">
  <app-header jbhPageHeader></app-header>

  <div class="jbh-container">
    @if (isLoading) {
      <jbh-card variant="form">
        <div class="jbh-loading-container">
          <jbh-spinner />
        </div>
      </jbh-card>
    }

    @if (!isLoading && team) {
      <jbh-card variant="form">
        <jbh-page-header
          variant="form"
          icon="people-outline"
          [title]="'teams.edit.formTitle' | translate"
          [subtitle]="'teams.edit.formSubtitle' | translate"
        />

        <form [formGroup]="teamForm" (ngSubmit)="onSubmit()">

          <jbh-text-field
            formControlName="shortName"
            icon="text-outline"
            requirement="required"
            [label]="'teams.edit.shortName.label' | translate"
            [placeholder]="'teams.edit.shortName.placeholder' | translate"
            [error]="hasError('shortName') ? getErrorMessage('shortName') : ''"
          />

          <jbh-text-field
            formControlName="name"
            icon="people-outline"
            requirement="required"
            [label]="'teams.edit.name.label' | translate"
            [placeholder]="'teams.edit.name.placeholder' | translate"
            [error]="hasError('name') ? getErrorMessage('name') : ''"
          />

          <button
            type="submit"
            jbhButton
            block
            icon="save-outline"
            [loading]="isSubmitting"
            [disabled]="isSubmitting || teamForm.invalid"
          >
            {{ (isSubmitting ? 'teams.edit.saving' : 'teams.edit.saveButton') | translate }}
          </button>

        </form>
      </jbh-card>
    }
  </div>
</jbh-page>
