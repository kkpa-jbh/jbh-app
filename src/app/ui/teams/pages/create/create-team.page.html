<jbh-page (pageEnter)="onPageEnter()" (pageLeave)="onPageLeave()">
  <app-header jbhPageHeader></app-header>

  <div class="jbh-container">
    @if (isCheckingLimit) {
      <jbh-card variant="form">
        <div class="jbh-loading-container">
          <jbh-spinner />
        </div>
      </jbh-card>
    }

    @if (!isCheckingLimit && !canCreateTeam) {
      <jbh-card variant="form">
        <div class="jbh-limit-error">
          <div class="jbh-limit-error-icon">
            <jbh-icon name="alert-circle-outline" />
          </div>
          <h2 class="jbh-limit-error-title">{{ 'teams.create.limitReached.title' | translate }}</h2>
          <p class="jbh-limit-error-message">{{ 'teams.create.limitReached.message' | translate:{ max: maxTeams } }}</p>
          <button
            type="button"
            jbhButton
            block
            icon="arrow-back-outline"
            (click)="navigateToOverview()"
          >
            {{ 'teams.create.limitReached.backButton' | translate }}
          </button>
        </div>
      </jbh-card>
    }

    @if (!isCheckingLimit && canCreateTeam) {
      <jbh-card variant="form">
        <jbh-page-header
          variant="form"
          icon="people-outline"
          [title]="'teams.create.formTitle' | translate"
          [subtitle]="'teams.create.formSubtitle' | translate"
        />

        <form [formGroup]="teamForm" (ngSubmit)="onSubmit()">

          <jbh-text-field
            formControlName="shortName"
            icon="text-outline"
            requirement="required"
            [label]="'teams.create.shortName.label' | translate"
            [placeholder]="'teams.create.shortName.placeholder' | translate"
            [error]="hasError('shortName') ? getErrorMessage('shortName') : ''"
          />

          <jbh-text-field
            formControlName="name"
            icon="people-outline"
            requirement="required"
            [label]="'teams.create.name.label' | translate"
            [placeholder]="'teams.create.name.placeholder' | translate"
            [error]="hasError('name') ? getErrorMessage('name') : ''"
          />

          <button
            type="submit"
            jbhButton
            block
            icon="save-outline"
            [loading]="isSubmitting"
            [disabled]="isSubmitting || teamForm.invalid"
          >
            {{ (isSubmitting ? 'teams.create.saving' : 'teams.create.saveButton') | translate }}
          </button>

        </form>
      </jbh-card>
    }
  </div>
</jbh-page>
