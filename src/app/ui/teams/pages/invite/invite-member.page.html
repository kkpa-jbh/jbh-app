<jbh-page (pageEnter)="onPageEnter()" (pageLeave)="onPageLeave()">
  <app-header jbhPageHeader></app-header>

  <div class="jbh-container">
    <jbh-card variant="form">
      <jbh-page-header
        variant="form"
        icon="mail-outline"
        [title]="'teams.invite.formTitle' | translate"
        [subtitle]="'teams.invite.formSubtitle' | translate"
      />

      <form [formGroup]="inviteForm" (ngSubmit)="onSubmit()">

        <jbh-select
          formControlName="teamId"
          icon="people-outline"
          requirement="required"
          [loading]="isLoadingTeams"
          [label]="'teams.invite.teamId.label' | translate"
          [placeholder]="'teams.invite.teamId.placeholder' | translate"
          [error]="hasError('teamId') ? getErrorMessage('teamId') : ''"
        >
          @for (team of teams; track team.id) {
            <jbh-select-option [value]="team.id">{{ team.name }} ({{ team.shortName }})</jbh-select-option>
          }
        </jbh-select>

        <jbh-text-field
          formControlName="emailOrUsername"
          icon="person-outline"
          requirement="required"
          [label]="'teams.invite.emailOrUsername.label' | translate"
          [placeholder]="'teams.invite.emailOrUsername.placeholder' | translate"
          [hint]="!hasError('emailOrUsername') && userExists ? userCheckMessage : ''"
          [error]="hasError('emailOrUsername')
            ? getErrorMessage('emailOrUsername')
            : (userExists === false ? userCheckMessage : '')"
        >
          @if (checkingUser) {
            <jbh-spinner jbhFieldSuffix />
          }
          @if (!checkingUser && userExists === true) {
            <jbh-icon jbhFieldSuffix class="invite-status invite-status--success" name="checkmark-circle-outline" />
          }
          @if (!checkingUser && userExists === false) {
            <jbh-icon jbhFieldSuffix class="invite-status invite-status--error" name="close-circle-outline" />
          }
        </jbh-text-field>

        <button
          type="submit"
          jbhButton
          block
          icon="send-outline"
          [loading]="isSubmitting"
          [disabled]="!canSubmit"
        >
          {{ (isSubmitting ? 'teams.invite.sending' : 'teams.invite.sendButton') | translate }}
        </button>

      </form>
    </jbh-card>
  </div>
</jbh-page>
