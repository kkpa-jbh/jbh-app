<jbh-page (pageEnter)="onPageEnter()" (pageLeave)="onPageLeave()">
  <app-header jbhPageHeader></app-header>

  <div class="jbh-container">
    @if (currentContext$ | async; as context) {
      <jbh-card>
        <h2>{{ 'settings.teamPreferences.forTeam' | translate: { teamName: context.teamName } }}</h2>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <jbh-toggle
            formControlName="notifications"
            [label]="'settings.teamPreferences.notifications' | translate"
          />

          <button type="submit" jbhButton block>
            {{ 'common.save' | translate }}
          </button>
        </form>
      </jbh-card>
    }
  </div>
</jbh-page>
